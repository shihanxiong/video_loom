# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytest

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12.1
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.1'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavformat-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config \
            python3-dev \
            build-essential \
            cython3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flake8 pytest freezegun
          # Install dependencies except tkvideoplayer (which requires av that doesn't build on Python 3.12)
          # Tests don't use tkvideoplayer, so we can skip it
          if [ -f video_loom_v1/requirements.txt ]; then
            # Create a temporary requirements file without tkvideoplayer
            grep -v "^tkvideoplayer" video_loom_v1/requirements.txt > /tmp/requirements_test.txt
            pip install -r /tmp/requirements_test.txt
            # Try to install tkvideoplayer, but don't fail if it doesn't work
            pip install tkvideoplayer || echo "Warning: tkvideoplayer installation failed (not needed for tests)"
          fi
      - name: Test with pytest
        working-directory: video_loom_v1/src
        run: |
          pytest test_*.py -vv -s

# This workflow will build and test the Go code for Video Loom v2
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go-code

name: Go Build and Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Go dependencies
        working-directory: video_loom_v2
        run: |
          go mod download
          go mod tidy
      - name: Install frontend dependencies
        working-directory: video_loom_v2/frontend
        run: |
          npm install
      - name: Build frontend
        working-directory: video_loom_v2/frontend
        run: |
          npm run build
      - name: Build Go application
        working-directory: video_loom_v2
        run: |
          go build -v ./...
      - name: Test (if tests exist)
        working-directory: video_loom_v2
        run: |
          go test -v ./... || echo "No tests found, skipping"
        continue-on-error: true

